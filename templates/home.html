{% extends "base.html" %} <!-- makes it so the base html page is implented around the content that is within the "block content" and "endblock" sections-->

{% block content %}
<h1>Welcome {{ username }}</h1>
{% for record in records %} 
<p>
    Random advice:
    {{ record[1] }} <br> <!-- takes the data from the database and prints the second column which in this situation is the advice itself-->
    {{ record[2 ]}} advice by {{ record[3] }} <br>
    see more advice here <br>
    <button onclick="window.location.href='/advice'">see more advice</button> <!-- button to the advice page-->
</p>
{% endfor %}
{% endblock %}
