{% extends "base.html" %}

{% block content %}
<h1>Create a Training Plan</h1>
<form action="/training_plan" method="post">
    <label for="exercise">Exercise:</label>
    <input type="text" name="exercise"> <br>
    <label for="type">What type of exercise is this:</label>
    <select id="type" name="type">
        <option value="cardio">Cardio</option>
        <option value="strength">Strength</option>
    </select> <br>
    <label for="sets">Sets:</label>
    <input type="number" name="sets"> <br>
    <label for="reps">Reps:</label>
    <input type="number" name="reps"> <br>
    <button type="submit">Submit</button>
</form>
{% endblock %}
