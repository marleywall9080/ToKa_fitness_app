{% extends "base.html" %}

{% block content %}
<h1>Post Advice</h1>
<form action="/create_advice" method="post"> <!-- the form on this page and on the other pages allows users to input data and that be saved to the database under their username so that it can be attributed back to them-->
    <label for="advice">Advice:</label>
    <input type="text" name="advice"> <br>
    <label for="type">What kind of Advice is this:</label>
    <select id="type" name="type">
        <option value="diet">Diet</option>
        <option value="weightloss">Weightloss</option>
        <option value="cardio">Cardio</option>
        <option value="strength">Strength</option>
    </select> <br>
    <button type="submit">Post</button>
</form>
{% endblock %}
