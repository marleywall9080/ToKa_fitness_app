<!DOCTYPE html>
<html lang="en">
    <head>
        {% if font_size == "small" %}
            <link rel="stylesheet" href="static/small_style.css"> <!-- link to the css style sheet-->
        {% elif font_size == "large" %}
            <link rel="stylesheet" href="static/large_style.css">
        {% else %}
            <link rel="stylesheet" href="static/medium_style.css">
        {% endif %}
        <meta charset="UTF-8">
        <title>ToKa Fitness</title>
    </head>

    <div class="header"> <!-- simple header to allow users to navigate the website-->
        <a href="/home">ToKa Fitness</a>
        <div class="header-right">
            <a href="/home">Home</a>
            <a href="/advice">Advice</a>
            <a href="/training">Training</a>
            <a href="/diet">Diet</a>
            <a href="/videos">Videos</a>
            <a href="/settings">Settings</a>
        </div>
    </div>

    <main>
        {% block content %}{% endblock %} <!-- this allows different pages to easily copy over the header without needing to copy and paste the header onto a new page or making multiple changes for one header change-->
    </main>
</html>
