{% extends "base.html" %}

{% block content %}
<h1>Diet</h1>

<table border="1">
    <tr>
        <th>Food</th>
        <th>Meal</th>
        <th>Calories</th>
    </tr>
    {% for record in records %}
    <tr>
        <td>{{ record [1] }}</td>
        <td>{{ record [2] }}</td>
        <td>{{ record [3] }}</td>
        <td>
            <form action="/delete" method="POST">
                <input type="hidden" value="record[0]" name="delete">
                <button type="submit">delete</button>
            </form>
        </td>

    </tr>
    {% endfor %}
</table>

<p>Total Calories: </p>
<p>{{ calories }}</p>

<p>Want to start planning your meals?</p>
<a href="/diet_plan">Plan here</a>
{% endblock %}
