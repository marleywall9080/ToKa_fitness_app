{% extends "base.html" %}

{% block content %}
<h1>Advice</h1>
<table border="1"> <!-- creates a table with the data from the called upon database and formats it so users can easily understand-->
    <tr>
        <th>Advice</th>
        <th>Type</th>
        <th>User</th>
    </tr>
    {% for record in records %}
    <tr>
        <td>{{ record[1] }}</td>
        <td>{{ record[2] }}</td>
        <td>{{ record[3] }}</td>
        {% if record[3] == username or username == "admin" %} <!-- makes sure users or staff can only delete their own pieces of advice-->
        <td>
            <form action="/delete" method="POST"> <!-- makes the button go to the delete function-->
                <input type="hidden" value="{{ record[0] }}" name="delete"> <!-- sends all the required information-->
                <input type="hidden" value="advice" name="table">
                <input type="hidden" value="advice_id" name="id">
                <input type="hidden" value="advice" name="url">
                <button type="submit">delete</button>
            </form>
        </td>
        {% endif %}
    </tr>
    {% endfor %}
</table>
<p>Want to post advice?</p>
<a href="/create_advice">Click here</a> <!-- link to the post advice page-->
{% endblock %}
