{% extends "base.html" %}

{% block content %}
<h1>Videos</h1>
<table border="1">
    <tr>
        <th>Video</th>
        <th>Type</th>
    </tr>
    {% for record in records %}
    <tr>
        <td>
            <iframe width="560" height="315" src="{{ record [1] }}" title="YouTube video player" frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe> <!-- you can find embed code directly on youtube-->
        </td>
        <td>{{ record[2] }}</td>
    </tr>
    {% endfor %}
</table>
<p>the joe wicks video is here purely for place holder reasons</p>
<p>Videos will be souly implemented by ToKa and so there is no addition page like with the others</p>
{% endblock %}
